<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DITL">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>DITL</title>
<style>
  :root {
    --red: #e0352b; --bg: #000; --row: #141416; --line: rgba(255,255,255,.08);
    --text: #f5f5f7; --dim: #8e8e93; --faint: #4a4a4f; --gold: #e3cfa8;
    --glass: rgba(20,20,22,.38); --hair: rgba(255,255,255,.16);
    --sans: "Avenir Next", "Avenir", "Helvetica Neue", -apple-system, system-ui, sans-serif;
    --serif: "Didot", "Bodoni 72", "Bodoni Moda", "Playfair Display", Georgia, serif;
    --ease: cubic-bezier(.2,.8,.2,1);
    --st: env(safe-area-inset-top); --sb: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 500 16px/1.35 var(--sans); -webkit-font-smoothing: antialiased;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .hidden { display: none !important; }
  .screen { position: fixed; top: 0; left: 0; right: 0; height: var(--app-h, 100dvh); display: none; flex-direction: column; overflow: hidden; }
  .screen.active { display: flex; }
  .caps { text-transform: uppercase; letter-spacing: .18em; font-size: 10.5px; font-weight: 600; }

  /* ---------- Camera ---------- */
  #camera, #camera * { touch-action: none; }  /* no browser zoom/pan on the camera screen; taps still work */
  html, body { touch-action: manipulation; }
  #camera { background: #000; }
  #preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000;
    transition: filter .35s var(--ease), opacity .35s var(--ease); }
  #preview.mirror { transform: scaleX(-1); }
  #preview.flipping { filter: blur(22px) brightness(.8); opacity: .85; }
  .cam-top { position: absolute; top: 0; left: 0; right: 0; height: calc(var(--st) + 72px);
    padding: calc(var(--st) + 14px) 16px 0; display: flex; justify-content: center; align-items: flex-start; gap: 8px;
    background: linear-gradient(rgba(0,0,0,.42), transparent); pointer-events: none; }
  .pill { background: var(--glass); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border: .5px solid var(--hair); padding: 7px 13px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: .18em; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
  #recTimer { display: flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; letter-spacing: .12em; }
  #recTimer::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--red);
    animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .cam-controls { position: absolute; left: 0; right: 0; bottom: 0;
    padding: 40px 26px calc(var(--sb) + 26px); display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(transparent, rgba(0,0,0,.45)); }
  .side { width: 72px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .side .caps { color: rgba(255,255,255,.85); text-shadow: 0 1px 6px rgba(0,0,0,.5); transition: color .3s; }
  .glass-btn { width: 50px; height: 50px; border-radius: 50%; background: var(--glass);
    backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border: .5px solid var(--hair); display: grid; place-items: center; position: relative;
    transition: transform .25s var(--ease), background .3s var(--ease), color .3s var(--ease); }
  .glass-btn:active { transform: scale(.9); }
  .glass-btn svg { width: 22px; height: 22px; stroke-width: 1.5; }
  .flip { position: absolute; right: 16px; top: calc(var(--st) + 8px); pointer-events: auto; width: 40px; height: 40px; }
  .flip svg { width: 19px; height: 19px; transition: transform .5s var(--ease); }
  .flip.spin svg { transform: rotate(180deg); }
  .act.off { visibility: hidden; }
  .act.same .glass-btn { background: rgba(255,255,255,.94); color: #000; border-color: transparent; }
  .act.same .caps { color: #fff; }
  .badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px; background: var(--red); font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }

  /* record button */
  .rec-btn { width: 86px; height: 86px; border-radius: 50%; position: relative; display: grid; place-items: center; }
  .rec-btn .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid #fff;
    transition: transform .35s var(--ease), border-color .35s var(--ease); }
  .rec-btn .apple { width: 64px; height: 64px; object-fit: contain; pointer-events: none; -webkit-user-drag: none;
    transition: transform .4s var(--ease), opacity .3s var(--ease); }
  .rec-btn .stop { position: absolute; width: 30px; height: 30px; border-radius: 8px; background: var(--red);
    transform: scale(.4); opacity: 0; transition: transform .4s var(--ease), opacity .3s var(--ease); }
  .rec-btn:active .apple { transform: scale(.9); }
  .rec-btn.recording .apple { transform: scale(.35) rotate(-14deg); opacity: 0; }
  .rec-btn.recording .stop { transform: scale(1); opacity: 1; }
  .rec-btn.recording .ring { transform: scale(1.05); }
  .rec-btn.recording::after { content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 1.5px solid var(--red); animation: halo 1.8s var(--ease) infinite; }
  @keyframes halo { 0% { transform: scale(.94); opacity: .9; } 100% { transform: scale(1.2); opacity: 0; } }

  .cam-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 32px; text-align: center; }
  .cam-msg div { max-width: 300px; }
  .cam-msg button { margin-top: 18px; background: #fff; color: #000; padding: 12px 22px; border-radius: 999px; }
  .toast { position: fixed; z-index: 40; left: 50%; bottom: calc(var(--sb) + 150px); transform: translate(-50%, 10px);
    opacity: 0; transition: all .3s var(--ease); pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .install-tip { position: absolute; top: calc(var(--st) + 60px); left: 16px; right: 16px;
    background: rgba(20,20,22,.85); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: .5px solid var(--hair); border-radius: 16px; padding: 14px 40px 14px 16px; font-size: 14px; color: #ccc; }
  .install-tip b { color: #fff; font-weight: 600; }
  .install-tip button { position: absolute; top: 10px; right: 12px; font-size: 20px; color: var(--dim); }

  /* ---------- Lists ---------- */
  header { padding: calc(var(--st) + 12px) 20px 14px; display: flex; align-items: baseline; gap: 12px;
    background: rgba(0,0,0,.82); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-bottom: .5px solid var(--line); flex-shrink: 0; }
  header h1 { margin: 0; font: 400 30px/1.1 var(--serif); flex: 1; letter-spacing: .01em; }
  .hdr-btn { color: var(--gold); text-transform: uppercase; letter-spacing: .18em; font-size: 11px; font-weight: 600; padding: 6px 2px; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; padding-bottom: calc(var(--sb) + 24px); }
  .day-row { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: .5px solid var(--line); width: 100%; text-align: left; }
  .day-row .num { width: 44px; text-align: center; flex-shrink: 0; }
  .day-row .num small { display: block; font-size: 9.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .2em; font-weight: 600; }
  .day-row .num strong { font: 400 30px/1.1 var(--serif); }
  .day-row .info { flex: 1; min-width: 0; }
  .day-row .info .t { font-weight: 600; font-size: 15px; }
  .day-row .info .s { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .day-row .thumbs { display: flex; }
  .day-row .thumbs img { width: 32px; height: 44px; object-fit: cover; border-radius: 7px; border: 1.5px solid var(--bg); margin-left: -10px; background: var(--row); }
  .day-row.today { background: linear-gradient(90deg, rgba(227,207,168,.10), transparent 70%); }
  .day-row.today .num strong, .day-row.today .info .t { color: var(--gold); }
  .day-row.locked { opacity: .3; pointer-events: none; }
  .day-row.empty .info .s { color: var(--faint); }
  .lock svg { width: 16px; height: 16px; color: var(--dim); stroke-width: 1.5; }
  .storage { text-align: center; color: var(--faint); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 20px; }

  .activity { padding: 18px 16px 4px; }
  .activity h2 { margin: 0 0 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .18em; font-size: 10.5px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .clip { position: relative; aspect-ratio: 9/16; border-radius: 12px; overflow: hidden; background: var(--row); }
  .clip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .clip .dur { position: absolute; right: 6px; bottom: 6px; font-size: 11px; font-weight: 600; letter-spacing: .05em;
    background: rgba(0,0,0,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 3px 7px; border-radius: 7px; }
  .empty-msg { color: var(--dim); text-align: center; padding: 70px 24px; font: italic 400 20px/1.4 var(--serif); }
  .day-actions { flex-shrink: 0; display: flex; gap: 10px; padding: 12px 16px calc(var(--sb) + 14px);
    border-top: .5px solid var(--line); background: #000; }
  .btn { flex: 1; padding: 16px; border-radius: 16px; text-align: center; border: .5px solid var(--hair);
    text-transform: uppercase; letter-spacing: .16em; font-size: 12px; font-weight: 600; }
  .btn.primary { background: #fff; color: #000; border-color: #fff; }
  .btn:disabled { opacity: .3; }

  /* day header + selection */
  header.day-hdr { align-items: center; }
  header.day-hdr h1 { font-size: 26px; }
  .hdr-icon { width: 34px; height: 34px; display: grid; place-items: center; color: var(--gold); }
  .hdr-icon svg { width: 24px; height: 24px; }
  .clip { cursor: pointer; }
  .clip .sel-mark { position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.9); background: rgba(0,0,0,.25); display: none; place-items: center; }
  .clip .sel-mark svg { width: 14px; height: 14px; opacity: 0; }
  .selecting .clip .sel-mark { display: grid; }
  .selecting .clip.selected .sel-mark { background: #fff; border-color: #fff; color: #000; }
  .selecting .clip.selected .sel-mark svg { opacity: 1; }
  .selecting .clip.selected img { opacity: .55; }
  .clip-ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .22s var(--ease); }
  .clip.open .clip-ov { opacity: 1; pointer-events: auto; }
  .view-btn { background: #fff; color: #000; border-radius: 999px; padding: 10px 12px; white-space: nowrap;
    text-transform: uppercase; letter-spacing: .14em; font-size: 9.5px; font-weight: 700; }
  .trash-btn { position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%); width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; color: var(--red); background: rgba(0,0,0,.45); border: .5px solid var(--hair); }
  .trash-btn svg { width: 18px; height: 18px; }
  .sel-bar { justify-content: center; }
  .del-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--red); padding: 2px 30px; }
  .del-btn svg { width: 26px; height: 26px; }
  .del-btn:disabled { opacity: .3; }
  .btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
  .sheet-wrap { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; }
  .sheet { width: 100%; background: #111113; border-top: .5px solid var(--hair); border-radius: 22px 22px 0 0;
    padding: 24px 18px calc(var(--sb) + 16px); display: flex; flex-direction: column; gap: 10px; text-align: center;
    animation: up .3s var(--ease); }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet-text { font: 400 24px/1.2 var(--serif); }
  .sheet .note { margin-bottom: 8px; }

  /* ---------- Overlays ---------- */
  .overlay { position: fixed; top: 0; left: 0; right: 0; height: var(--app-h, 100dvh); background: #000; z-index: 10; display: flex; flex-direction: column; }
  .overlay video { flex: 1; width: 100%; min-height: 0; object-fit: contain; background: #000; }
  .ov-bar { display: flex; gap: 10px; padding: 12px 16px calc(var(--sb) + 14px); }
  .ov-top { padding: calc(var(--st) + 14px) 20px 10px; display: flex; justify-content: space-between; align-items: center; }
  .export-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; gap: 16px; }
  .progress { width: 70%; height: 2px; border-radius: 1px; background: var(--line); overflow: hidden; }
  .progress div { height: 100%; width: 0; background: var(--gold); transition: width .2s linear; }
  .overlay #exportSrc { flex: none; width: auto; max-width: 62%; max-height: 48vh; border-radius: 14px; background: #111; }
  #exportStatus { font: italic 400 20px var(--serif); }
  .note { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .16em; font-weight: 600; }
</style>
</head>
<body>

<!-- CAMERA (home screen) -->
<section id="camera" class="screen active">
  <video id="preview" autoplay playsinline muted></video>
  <div class="cam-top">
    <div id="dateLabel" class="pill"></div>
    <div id="recTimer" class="pill hidden">0:00</div>
    <button id="flipBtn" class="glass-btn flip" aria-label="Flip camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5A7.6 7.6 0 0 1 18 7.2L19.8 9"/><path d="M19.8 4.6V9h-4.4"/><path d="M19.5 13.5A7.6 7.6 0 0 1 6 16.8L4.2 15"/><path d="M4.2 19.4V15h4.4"/></svg>
    </button>
  </div>
  <div id="installTip" class="install-tip hidden">
    <b>Add DITL to your Home Screen</b> so your clips are kept: tap <b>Share</b> → <b>Add to Home Screen</b>, then open it from the icon.
    <button id="tipClose" aria-label="Dismiss">×</button>
  </div>
  <div id="camMsg" class="cam-msg hidden"><div><div id="camMsgText"></div><button id="camRetry">Turn on camera</button></div></div>
  <div class="cam-controls">
    <div class="side">
      <button id="toCalendar" class="glass-btn" aria-label="Your days">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 9.8h17M8 3v3.6M16 3v3.6"/><circle cx="8.5" cy="14.5" r=".6" fill="currentColor"/></svg>
        <span id="todayBadge" class="badge hidden">0</span>
      </button>
      <span class="caps">Days</span>
    </div>
    <button id="recBtn" class="rec-btn" aria-label="Record"><span class="ring"></span><img class="apple" src="apple.png" alt=""><span class="stop"></span></button>
    <div id="actWrap" class="side act">
      <button id="actBtn" class="glass-btn" aria-label="Activity">
        <svg id="icNew" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 13a7.5 7.5 0 1 1-8-7.48"/><path d="M18 2.8v6.4M14.8 6h6.4"/></svg>
        <svg id="icSame" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10.2 13.8a4 4 0 0 0 5.66 0l3.1-3.1a4 4 0 0 0-5.66-5.66l-1.2 1.2"/><path d="M13.8 10.2a4 4 0 0 0-5.66 0l-3.1 3.1a4 4 0 0 0 5.66 5.66l1.2-1.2"/></svg>
      </button>
      <span id="actLabel" class="caps">New</span>
    </div>
  </div>
</section>

<!-- CALENDAR -->
<section id="calendar" class="screen">
  <header><h1>Your days</h1><button id="calToCam" class="hdr-btn">Camera</button></header>
  <div id="dayList" class="scroll"></div>
</section>

<!-- DAY -->
<section id="day" class="screen">
  <header class="day-hdr"><button id="dayBack" class="hdr-btn">‹ Days</button><h1 id="dayTitle"></h1>
    <button id="selectBtn" class="hdr-icon" aria-label="Select clips"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.4 12.3l2.4 2.4 4.8-5"/></svg></button>
    <button id="selectCancel" class="hdr-btn hidden">Cancel</button></header>
  <div id="dayContent" class="scroll"></div>
  <div id="selBar" class="day-actions sel-bar hidden">
    <button id="delSelected" class="del-btn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V5.2a1.2 1.2 0 0 1 1.2-1.2h2.6a1.2 1.2 0 0 1 1.2 1.2V7M6.5 7l.85 12.1a2 2 0 0 0 2 1.9h5.3a2 2 0 0 0 2-1.9L17.5 7M10 11v6M14 11v6"/></svg><span class="caps" id="delLabel">Delete</span></button>
  </div>
  <div id="dayActions" class="day-actions">
    <button id="dayRecord" class="btn">Record</button>
    <button id="exportBtn" class="btn primary">Make video</button>
  </div>
</section>

<div id="toast" class="toast pill"></div>

<!-- CONFIRM SHEET -->
<div id="sheet" class="sheet-wrap hidden">
  <div class="sheet">
    <div id="sheetText" class="sheet-text"></div>
    <div class="note" id="sheetSub">This can’t be undone.</div>
    <button id="sheetOk" class="btn danger">Delete</button>
    <button id="sheetCancel" class="btn">Cancel</button>
  </div>
</div>

<!-- CLIP PLAYER -->
<div id="player" class="overlay hidden">
  <div class="ov-top"><span id="playerInfo" class="note"></span><button id="playerClose" class="hdr-btn">Done</button></div>
  <video id="playerVideo" playsinline controls></video>
  <div class="ov-bar"><button id="playerDelete" class="btn">Delete clip</button></div>
</div>

<!-- EXPORT -->
<div id="exportOv" class="overlay hidden">
  <div class="ov-top"><span class="note" id="exportTitle">Making your film</span><button id="exportClose" class="hdr-btn">Cancel</button></div>
  <div id="exportWorking" class="export-body">
    <video id="exportSrc" playsinline></video>
    <div class="progress"><div id="exportBar"></div></div>
    <div id="exportStatus">Starting…</div>
    <div class="note">Keep the app open until it's done.</div>
  </div>
  <video id="exportResult" class="hidden" playsinline controls></video>
  <div id="exportDone" class="ov-bar hidden"><button id="saveBtn" class="btn primary">Save to Camera Roll</button></div>
</div>

<!-- hidden helpers: recording canvas + export player -->
<canvas id="exportCanvas" style="position:fixed;width:2px;height:2px;opacity:0.01;pointer-events:none;left:0;top:0"></canvas>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const FUTURE_DAYS = 14;
const MIN_PAST_DAYS = 6;

/* ================= Dates ================= */
const pad = n => String(n).padStart(2, '0');
const dateKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const keyToDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtLong = d => d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
const fmtShort = d => d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const fmtTime = t => new Date(t).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
const fmtDur = s => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

/* ================= Storage (IndexedDB) ================= */
// "clips": small metadata + thumbnail.  "blobs": the actual video data.
let dbPromise;
function db() {
  if (!dbPromise) dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open('ditl', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('clips', { keyPath: 'id' }).createIndex('date', 'date');
      d.createObjectStore('blobs');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbPromise;
}
function req2p(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function saveClip(meta, blob) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(['clips', 'blobs'], 'readwrite');
    t.objectStore('clips').put(meta);
    t.objectStore('blobs').put(blob, meta.id);
    t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
async function deleteClip(id) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(['clips', 'blobs'], 'readwrite');
    t.objectStore('clips').delete(id);
    t.objectStore('blobs').delete(id);
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}
async function updateMetas(metas) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction('clips', 'readwrite');
    for (const m of metas) t.objectStore('clips').put(m);
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}
async function allClips() { const d = await db(); return req2p(d.transaction('clips').objectStore('clips').getAll()); }
async function clipsFor(date) {
  const d = await db();
  const list = await req2p(d.transaction('clips').objectStore('clips').index('date').getAll(date));
  return list.sort((a, b) => a.createdAt - b.createdAt);
}
async function blobFor(id) { const d = await db(); return req2p(d.transaction('blobs').objectStore('blobs').get(id)); }

/* ================= Navigation ================= */
let screen = 'camera';
function show(name) {
  screen = name;
  for (const s of document.querySelectorAll('.screen')) s.classList.toggle('active', s.id === name);
  if (name === 'camera') startCamera(); else stopCamera();

/* ================= Camera + recording ================= */
// Clips are recorded straight from the camera (smoothest, highest quality).
// Flipping mid-recording ends one segment and starts the next; segments of one
// recording share a takeId, show as one clip, and play back-to-back.
const preview = $('preview'), recBtn = $('recBtn');
let stream = null, facing = 'user', recorder = null, take = null, timerInt = null, starting = null, flipping = false;

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

function pickMime(cands) {
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
  return cands.find(t => MediaRecorder.isTypeSupported(t)) || '';
}
const CLIP_MIMES = ['video/mp4;codecs=avc1,mp4a', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
const AUDIO = { echoCancellation: false, noiseSuppression: false, autoGainControl: false, sampleRate: 48000 };
// Ask for a steady 30fps (min 24 keeps the phone from dropping frames in dim light); fall back if refused.
const videoConstraints = strict => ({ facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 },
  frameRate: strict ? { ideal: 30, min: 24 } : { ideal: 30 } });
async function openCam(withAudio) {
  const audio = withAudio ? AUDIO : false;
  try { return await navigator.mediaDevices.getUserMedia({ video: videoConstraints(true), audio }); }
  catch (e) {
    if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) throw e;
    return navigator.mediaDevices.getUserMedia({ video: videoConstraints(false), audio });
  }
}

function camMsg(text) {
  $('camMsgText').textContent = text;
  $('camMsg').classList.toggle('hidden', !text);
}
function isRecording() { return !!take; }

async function attachPreview() {
  preview.srcObject = stream;
  preview.classList.toggle('mirror', facing === 'user');
  await preview.play().catch(() => {});
}

async function startCamera() {
  if (stream || starting) return starting;
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    camMsg('The camera only works when this app is opened from an https:// address.');
    return;
  }
  starting = (async () => {
    try {
      const s = await openCam(true);
      if (screen !== 'camera' || document.hidden) { s.getTracks().forEach(t => t.stop()); return; }
      stream = s;
      await attachPreview();
      camMsg('');
    } catch (e) {
      console.warn(e);
      camMsg(e && e.name === 'NotAllowedError'
        ? 'DITL needs your camera and microphone. Tap below, then choose Allow.'
        : 'Couldn’t start the camera. ' + (e && e.message ? e.message : ''));
    } finally { starting = null; }
  })();
  return starting;
}
function stopCamera() {
  if (isRecording()) return; // never kill an active recording here
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; preview.srcObject = null; }
}

function grabThumb() {
  const w = preview.videoWidth, h = preview.videoHeight;
  if (!w || !h) return '';
  const c = document.createElement('canvas');
  const scale = 240 / Math.max(w, h);
  c.width = Math.round(w * scale); c.height = Math.round(h * scale);
  c.getContext('2d').drawImage(preview, 0, 0, c.width, c.height);
  try { return c.toDataURL('image/jpeg', 0.75); } catch { return ''; }
}

function startSegment() {
  const t = take;
  const mime = pickMime(CLIP_MIMES);
  let r;
  try { r = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 10_000_000, audioBitsPerSecond: 192_000 } : undefined); }
  catch (e) { r = new MediaRecorder(stream); }
  const segChunks = [], segStart = Date.now(), part = t.parts++;
  const thumb = grabThumb() || t.thumb;
  if (!t.thumb) t.thumb = thumb;
  r.ondataavailable = e => { if (e.data && e.data.size) segChunks.push(e.data); };
  r.stopped = new Promise(resolve => {
    r.onstop = async () => {
      const duration = (Date.now() - segStart) / 1000;
      const type = (r.mimeType || mime || 'video/mp4').split(';')[0];
      const blob = new Blob(segChunks, { type });
      if (blob.size > 2000 && duration >= 0.3) {
        if (session.date !== t.date) await newSession(); // crossed midnight while open
        const meta = { id: uid(), date: t.date, activityId: sessionActivityId(), takeId: t.id, part,
                       createdAt: segStart, duration, type, size: blob.size, thumb: t.thumb || thumb };
        session.clipIds.push(meta.id);
        try { await saveClip(meta, blob); t.saved++; }
        catch (e) { console.error(e); t.failed = true; }
      }
      resolve();
    };
  });
  t.pending.push(r.stopped);
  r.start(1000);
  recorder = r;
}

function startRecording() {
  if (!stream || flipping) { if (!stream) startCamera(); return; }
  take = { id: uid(), date: dateKey(), start: Date.now(), parts: 0, saved: 0, pending: [], thumb: '' };
  startSegment();
  recBtn.classList.add('recording');
  $('recTimer').classList.remove('hidden');
  $('dateLabel').classList.add('hidden');
  $('recTimer').textContent = '0:00';
  const t0 = take.start;
  timerInt = setInterval(() => { $('recTimer').textContent = fmtDur((Date.now() - t0) / 1000); }, 250);
}
async function stopRecording() {
  if (!take) return;
  const t = take;
  clearInterval(timerInt);
  recBtn.classList.remove('recording');
  $('recTimer').classList.add('hidden');
  $('dateLabel').classList.remove('hidden');
  if (recorder && recorder.state === 'recording') recorder.stop();
  recorder = null;
  take = null;
  await Promise.all(t.pending);
  if (t.failed) toast('Couldn’t save clip');
  else if (t.saved) {
    if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
    const n = takeCount(await clipsFor(dateKey()));
    toast(`Saved · ${n} clip${n === 1 ? '' : 's'} today`);
  }
  updateBadge();
}
function takeCount(clips) { return new Set(clips.map(c => c.takeId || c.id)).size; }

// Swap the camera. If recording, the current segment ends and a new one starts right after.
async function flipCamera() {
  if (flipping) return;
  flipping = true;
  const prev = facing;
  facing = facing === 'user' ? 'environment' : 'user';
  preview.classList.add('flipping');
  $('flipBtn').classList.toggle('spin');
  try {
    if (!stream) { await startCamera(); return; }
    if (take && recorder && recorder.state === 'recording') { recorder.stop(); recorder = null; }
    const audio = stream.getAudioTracks();
    stream.getVideoTracks().forEach(t => t.stop());
    let vs;
    try { vs = await openCam(false); }
    catch (e) { facing = prev; vs = await openCam(false); toast('Couldn’t switch camera'); }
    stream = new MediaStream([...vs.getVideoTracks(), ...audio]);
    await attachPreview();
    if (preview.readyState < 2) await new Promise(r => { preview.onloadeddata = r; setTimeout(r, 400); });
    if (take) startSegment();
  } catch (e) {
    console.warn(e);
    camMsg('Couldn’t switch camera. ' + (e && e.message ? e.message : ''));
  } finally {
    preview.classList.remove('flipping');
    flipping = false;
  }
}

function drawCover(ctx, v, W, H) {
  const vw = v.videoWidth, vh = v.videoHeight;
  if (!vw || !vh) return;
  const s = Math.max(W / vw, H / vh);
  const dw = vw * s, dh = vh * s;
  ctx.drawImage(v, (W - dw) / 2, (H - dh) / 2, dw, dh);
}

recBtn.addEventListener('click', () => { if (flipping) return; if (isRecording()) stopRecording(); else startRecording(); });
$('flipBtn').addEventListener('click', flipCamera);

// Double-tap anywhere on the camera view flips the camera (works while recording too).
let lastTap = 0, lastTapX = 0, lastTapY = 0;
const isBg = el => !el.closest('button, .install-tip, .cam-msg, .cam-controls');
function registerTap(x, y) {
  const now = Date.now();
  const dbl = now - lastTap < 300 && Math.hypot(x - lastTapX, y - lastTapY) < 50;
  if (dbl) { lastTap = 0; flipCamera(); } else { lastTap = now; lastTapX = x; lastTapY = y; }
  return dbl;
}
// Touch (iPhone): handle on touchend and cancel the browser's own double-tap action (zoom).
$('camera').addEventListener('touchend', e => {
  if (!isBg(e.target) || e.changedTouches.length !== 1 || e.touches.length) return;
  const t = e.changedTouches[0];
  e.preventDefault();
  registerTap(t.clientX, t.clientY);
}, { passive: false });
// Mouse (computers)
$('camera').addEventListener('pointerup', e => {
  if (e.pointerType === 'touch' || !isBg(e.target)) return;
  registerTap(e.clientX, e.clientY);
});
$('camera').addEventListener('dblclick', e => e.preventDefault());
// Block pinch-zoom gestures in the home-screen app.
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
$('camRetry').addEventListener('click', () => { stopCamera(); startCamera(); });

/* ---- Activities ----
   Every time the app is opened = a new activity by default.
   All clips recorded during that opening share it.
   The bottom-right button switches this opening to "same activity as last time". */
const session = { date: '', newId: '', prevId: null, prevNum: 0, mode: 'new', clipIds: [] };

async function todaysActivities() {
  const clips = await clipsFor(dateKey());
  const order = [];
  for (const c of clips) { const a = c.activityId || c.id; if (!order.includes(a)) order.push(a); }
  return { clips, order };
}
async function newSession() {
  session.date = dateKey();
  session.newId = uid();
  session.mode = 'new';
  session.clipIds = [];
  const { clips, order } = await todaysActivities();
  const last = clips[clips.length - 1];
  session.prevId = last ? (last.activityId || last.id) : null;
  session.prevNum = session.prevId ? order.indexOf(session.prevId) + 1 : 0;
  session.newNum = order.length + 1;
  renderActBtn();
}
function sessionActivityId() { return session.mode === 'same' && session.prevId ? session.prevId : session.newId; }
function renderActBtn() {
  const w = $('actWrap');
  w.classList.toggle('off', !session.prevId);
  w.classList.toggle('same', session.mode === 'same');
  $('icNew').classList.toggle('hidden', session.mode === 'same');
  $('icSame').classList.toggle('hidden', session.mode !== 'same');
  $('actLabel').textContent = session.mode === 'same' ? 'Continue' : 'New';
}
$('actBtn').addEventListener('click', async () => {
  if (!session.prevId) return;
  session.mode = session.mode === 'same' ? 'new' : 'same';
  renderActBtn();
  // Move anything already recorded in this opening to the chosen activity.
  if (session.clipIds.length) {
    const clips = await clipsFor(session.date);
    const mine = clips.filter(c => session.clipIds.includes(c.id));
    mine.forEach(c => c.activityId = sessionActivityId());
    await updateMetas(mine);
  }
  toast(session.mode === 'same' ? `Continuing activity ${session.prevNum}` : `New activity \u00b7 ${session.newNum}`);
});

let toastT;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ================= Calendar ================= */
async function openCalendar() {
  show('calendar');
  const clips = await allClips();
  const byDate = {};
  for (const c of clips) (byDate[c.date] ||= []).push(c);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const todayK = dateKey(today);
  const dates = Object.keys(byDate).sort();
  let earliest = addDays(today, -MIN_PAST_DAYS);
  if (dates.length && keyToDate(dates[0]) < earliest) earliest = keyToDate(dates[0]);

  const list = $('dayList');
  list.innerHTML = '';
  let todayRow, yesterdayRow;
  const yesterdayK = dateKey(addDays(today, -1));
  // Oldest at the top, today in the middle, locked future days below.
  for (let d = new Date(earliest); d <= addDays(today, FUTURE_DAYS); d = addDays(d, 1)) {
    const k = dateKey(d);
    const items = (byDate[k] || []).sort((a, b) => a.createdAt - b.createdAt);
    const future = d > today, isToday = k === todayK;
    const row = document.createElement('button');
    row.className = 'day-row' + (future ? ' locked' : '') + (isToday ? ' today' : '') + (!items.length && !future ? ' empty' : '');
    const total = items.reduce((s, c) => s + c.duration, 0);
    const label = isToday ? 'Today' : d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
    const sub = future ? 'Locked' : items.length ? `${items.length} clip${items.length === 1 ? '' : 's'} · ${fmtDur(total)}` : 'Nothing recorded';
    row.innerHTML = `
      <div class="num"><small>${d.toLocaleDateString(undefined, { weekday: 'short' })}</small><strong>${d.getDate()}</strong></div>
      <div class="info"><div class="t"></div><div class="s"></div></div>
      ${future ? '<div class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>'
               : '<div class="thumbs"></div>'}`;
    row.querySelector('.t').textContent = label;
    row.querySelector('.s').textContent = sub;
    const th = row.querySelector('.thumbs');
    if (th) for (const c of items.slice(-3)) if (c.thumb) { const im = new Image(); im.src = c.thumb; th.appendChild(im); }
    if (!future) row.addEventListener('click', () => openDay(k));
    if (isToday) todayRow = row;
    if (k === yesterdayK) yesterdayRow = row;
    list.appendChild(row);
  }
  const foot = document.createElement('div');
  foot.className = 'storage';
  list.appendChild(foot);
  if (navigator.storage?.estimate) navigator.storage.estimate().then(e => {
    foot.textContent = `${(e.usage / 1e6).toFixed(0)} MB used on this phone`;
  }).catch(() => {});
  // Open with yesterday as the top row (scroll up for older days).
  if (yesterdayRow) {
    const room = list.clientHeight - (list.scrollHeight - yesterdayRow.offsetTop);
    if (room > 0) { const sp = document.createElement('div'); sp.style.height = room + 'px'; list.appendChild(sp); }
    list.scrollTop = yesterdayRow.offsetTop;
  }
}

/* ================= Day view ================= */
let currentDay = null, dayClips = [], dayUrls = new Map();
function releaseUrls() { for (const u of dayUrls.values()) URL.revokeObjectURL(u); dayUrls.clear(); }

function groupActivities(clips) {
  const map = new Map();
  for (const c of clips) {
    const a = c.activityId || c.id;
    if (!map.has(a)) map.set(a, []);
    map.get(a).push(c);
  }
  return [...map.values()];
}

function groupTakes(clips) {
  const map = new Map();
  for (const c of clips) { const t = c.takeId || c.id; if (!map.has(t)) map.set(t, []); map.get(t).push(c); }
  return [...map.values()].map(p => p.sort((a, b) => a.createdAt - b.createdAt));
}
async function openDay(k) {
  show('day');
  selecting = false; selected.clear();
  currentDay = k;
  releaseUrls();
  const d = keyToDate(k);
  const isToday = k === dateKey();
  $('dayTitle').textContent = isToday ? 'Today' : fmtShort(d);
  $('dayRecord').classList.toggle('hidden', !isToday);
  dayClips = groupActivities(await clipsFor(k)).flatMap(g => groupTakes(g).flat());
  // Prepare playable URLs up front so "Make video" can start instantly on tap (iOS needs that).
  for (const c of dayClips) {
    const b = await blobFor(c.id);
    if (b) dayUrls.set(c.id, URL.createObjectURL(b));
  }
  renderDay();
}
let selecting = false, selected = new Set(), openTile = null;
const TRASH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V5.2a1.2 1.2 0 0 1 1.2-1.2h2.6a1.2 1.2 0 0 1 1.2 1.2V7M6.5 7l.85 12.1a2 2 0 0 0 2 1.9h5.3a2 2 0 0 0 2-1.9L17.5 7M10 11v6M14 11v6"/></svg>';
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4 8-8.5"/></svg>';

function renderDay() {

  $('selectBtn').classList.toggle('hidden', selecting || !dayClips.length);

    const done = v => { $('sheet').classList.add('hidden'); $('sheetOk').onclick = $('sheetCancel').onclick = $('sheet').onclick = null; res(v); };
    $('sheetOk').onclick = e => { e.stopPropagation(); done(true); };

async function askDelete(takes, after) {
  const n = takes.length;
  if (!await confirmSheet(n === 1 ? 'Delete this clip?' : `Delete ${n} clips?`)) return;
  const ids = takes.flat().map(p => p.id);
  for (const id of ids) {
    await deleteClip(id);
    const u = dayUrls.get(id); if (u) { URL.revokeObjectURL(u); dayUrls.delete(id); }
  }
  dayClips = dayClips.filter(c => !ids.includes(c.id));
  toast(n === 1 ? 'Clip deleted' : `${n} clips deleted`);

  updateBadge();
}

  v.play().catch(() => {});
});
function closePlayer() { const v = $('playerVideo'); v.pause(); v.removeAttribute('src'); v.load(); $('player').classList.add('hidden'); playing = null; }
$('playerClose').addEventListener('click', closePlayer);
$('playerDelete').addEventListener('click', async () => {
  if (!playing) return;
  const parts = playing;
  $('playerVideo').pause();
  if (!await confirmSheet('Delete this clip?')) return;
  closePlayer();
  await askDeleteNow([parts]);
});
async function askDeleteNow(takes) {
  const ids = takes.flat().map(p => p.id);
  for (const id of ids) { await deleteClip(id); const u = dayUrls.get(id); if (u) { URL.revokeObjectURL(u); dayUrls.delete(id); } }
  dayClips = dayClips.filter(c => !ids.includes(c.id));
  toast('Clip deleted'); renderDay(); updateBadge();
}

/* ================= Export (stitch clips into one video) ================= */
// Plays each clip in order onto a canvas and records the canvas + audio.
// Runs in real time, needs no server and no extra libraries.
const srcV = $('exportSrc'), canvas = $('exportCanvas'), cx = canvas.getContext('2d');
let actx = null, audioDest = null, exporting = null, resultFile = null, resultUrl = null, wakeLock = null;

function ensureAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
    const src = actx.createMediaElementSource(srcV);
    audioDest = actx.createMediaStreamDestination();
    src.connect(audioDest);
  }
  if (navigator.audioSession) { try { navigator.audioSession.type = 'playback'; } catch {} }
  actx.resume();
}


function waitEvent(el, ev) { return new Promise((res, rej) => {
  const ok = () => { cleanup(); res(); }, bad = () => { cleanup(); rej(el.error || new Error(ev + ' failed')); };
  const cleanup = () => { el.removeEventListener(ev, ok); el.removeEventListener('error', bad); };
  el.addEventListener(ev, ok, { once: true }); el.addEventListener('error', bad, { once: true });
}); }

$('exportBtn').addEventListener('click', () => {
  if (!dayClips.length || exporting) return;
  const clips = dayClips.filter(c => dayUrls.has(c.id));
  if (!clips.length) return;
  // --- must happen synchronously inside the tap, or iPhone blocks sound ---
  ensureAudio();
  srcV.muted = false;
  srcV.src = dayUrls.get(clips[0].id);
  const primed = srcV.play().then(() => srcV.pause()).catch(() => {});
  runExport(clips, primed);
});

async function runExport(clips, primed) {
  const state = exporting = { cancelled: false };
  $('exportOv').classList.remove('hidden');
  $('exportWorking').classList.remove('hidden');
  $('exportResult').classList.add('hidden');
  $('exportDone').classList.add('hidden');
  $('exportClose').textContent = 'Cancel';
  $('exportTitle').textContent = 'Making your video';
  $('exportBar').style.width = '0%';
  $('exportStatus').textContent = 'Getting ready…';
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}

  let raf = 0, rec = null, running = false;
  try {
    await primed;
    if (srcV.readyState < 1) await waitEvent(srcV, 'loadedmetadata');
    // Output size follows the first clip, capped at 1920 on the long side.
    let W = srcV.videoWidth || 720, H = srcV.videoHeight || 1280;
    const k = Math.min(1, 1920 / Math.max(W, H));
    W = Math.round(W * k / 2) * 2; H = Math.round(H * k / 2) * 2;
    canvas.width = W; canvas.height = H;
    cx.fillStyle = '#000'; cx.fillRect(0, 0, W, H);
    cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';

    const totalDur = clips.reduce((s, c) => s + c.duration, 0);
    let doneDur = 0;

    // Draw each decoded frame exactly once (requestVideoFrameCallback) and push it out
    // with requestFrame() when available, instead of sampling on a timer (which stutters).
    let vStream = canvas.captureStream(0);
    let vTrack = vStream.getVideoTracks()[0];
    const manual = !!(vTrack && typeof vTrack.requestFrame === 'function');
    if (!manual) { vStream.getTracks().forEach(t => t.stop()); vStream = canvas.captureStream(30); vTrack = vStream.getVideoTracks()[0]; }
    const useRVFC = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;
    running = true; let armed = false;
    const paint = () => {
      if (srcV.readyState >= 2) { drawCover(cx, srcV, W, H); if (manual) vTrack.requestFrame(); }
    };
    const onFrame = () => { armed = false; if (!running) return; paint(); arm(); };
    const arm = () => { if (useRVFC && running && !armed) { armed = true; srcV.requestVideoFrameCallback(onFrame); } };
    const tick = () => {
      if (!running) return;
      if (!useRVFC) paint();
      const p = Math.min(1, (doneDur + (srcV.currentTime || 0)) / (totalDur || 1));
      $('exportBar').style.width = (p * 100).toFixed(1) + '%';
      raf = requestAnimationFrame(tick);
    };
    const draw = () => { tick(); arm(); };

    const tracks = [...vStream.getVideoTracks(), ...audioDest.stream.getAudioTracks()];
    const outStream = new MediaStream(tracks);
    const mime = pickMime(['video/mp4;codecs=avc1,mp4a', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm']);
    rec = new MediaRecorder(outStream, mime ? { mimeType: mime, videoBitsPerSecond: 12_000_000, audioBitsPerSecond: 192_000 } : undefined);
    const outChunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) outChunks.push(e.data); };
    const recStopped = new Promise(r => rec.onstop = r);

    rec.start(1000);
    draw();
    for (let i = 0; i < clips.length; i++) {
      if (state.cancelled || state.backgrounded) throw new Error('stopped');
      $('exportStatus').textContent = `Clip ${i + 1} of ${clips.length}`;
      if (i > 0) { srcV.src = dayUrls.get(clips[i].id); await waitEvent(srcV, 'loadeddata'); }
      else srcV.currentTime = 0;
      if (state.cancelled || state.backgrounded) throw new Error('stopped');
      const ended = waitEvent(srcV, 'ended');
      await srcV.play();
      arm();
      await Promise.race([ended, new Promise((_, rej) => state.reject = rej)]);
      doneDur += clips[i].duration;
    }
    await new Promise(r => setTimeout(r, 150));
    running = false;
    cancelAnimationFrame(raf);
    rec.stop();
    await recStopped;
    vStream.getTracks().forEach(t => t.stop());

    const type = (rec.mimeType || mime || 'video/mp4').split(';')[0];
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(outChunks, { type });
    resultFile = new File([blob], `DITL-${clips[0].date}.${ext}`, { type });
    if (resultUrl) URL.revokeObjectURL(resultUrl);
    resultUrl = URL.createObjectURL(blob);

    $('exportWorking').classList.add('hidden');
    const rv = $('exportResult');
    rv.src = resultUrl; rv.classList.remove('hidden');
    $('exportDone').classList.remove('hidden');
    $('exportClose').textContent = 'Done';
    $('exportTitle').textContent = `${fmtShort(keyToDate(clips[0].date))} · ${fmtDur(totalDur)}`;
  } catch (e) {
    running = false;
    cancelAnimationFrame(raf);
    try { if (rec && rec.state !== 'inactive') rec.stop(); } catch {}
    srcV.pause();
    if (!state.cancelled) {
      console.error(e);
      $('exportStatus').textContent = state.backgrounded
        ? 'Stopped because the app was closed. Tap Cancel and try again, keeping the app open.'
        : 'Something went wrong making the video. ' + (e && e.message ? e.message : '');
      $('exportClose').textContent = 'Close';
    } else {
      $('exportOv').classList.add('hidden');
    }
  } finally {
    exporting = null;
    try { wakeLock && wakeLock.release(); } catch {} wakeLock = null;
  }
}
function cancelExport(backgrounded) {
  if (!exporting) return;
  exporting.cancelled = !backgrounded;
  exporting.backgrounded = !!backgrounded;
  srcV.pause();
  exporting.reject && exporting.reject(new Error('stopped'));
}
$('exportClose').addEventListener('click', () => {
  if (exporting) { cancelExport(false); return; }
  const rv = $('exportResult'); rv.pause();
  $('exportOv').classList.add('hidden');
});
$('saveBtn').addEventListener('click', async () => {
  if (!resultFile) return;
  try {
    if (navigator.canShare && navigator.canShare({ files: [resultFile] })) {
      await navigator.share({ files: [resultFile], title: resultFile.name });
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = resultUrl; a.download = resultFile.name;
  document.body.appendChild(a); a.click(); a.remove();
});

/* ================= App lifecycle ================= */
// Closing/leaving the app stops & saves any recording and releases the camera.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (exporting) cancelExport(true);
    stopRecording().then(() => { if (document.hidden) stopCamera(); });
    if (!recorder) stopCamera();
  } else {
    updateDateLabel(); updateBadge();
    if (!recorder) newSession();
    if (screen === 'camera') startCamera();
    else if (screen === 'calendar') openCalendar();
  }
});
window.addEventListener('pagehide', () => { stopRecording(); });

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// Home-screen app: size every screen to the real display height (avoids gaps on some iPhones).
function fitScreen() {
  const portrait = innerHeight >= innerWidth;
  const h = standalone && portrait ? Math.max(innerHeight, screen.height) : innerHeight;
  document.documentElement.style.setProperty('--app-h', h + 'px');
}
fitScreen();
addEventListener('resize', fitScreen);
addEventListener('orientationchange', () => setTimeout(fitScreen, 300));

updateDateLabel();
updateBadge();
newSession();
startCamera();
})();
</script>
</body>
